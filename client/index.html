<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>client</title>
    <style>
      /*
       * Critical background, inlined so the very first paint is already the
       * right colour.
       *
       * The data-theme stamp below is not enough on its own: every stylesheet
       * is imported from main.tsx, so in dev Vite injects them from JavaScript
       * and the document reaches first paint with no CSS attached at all —
       * an unstyled white page, whatever data-theme says. (A production build
       * does emit a <link> in this head, so there it is belt-and-braces.)
       *
       * Only the page background lives here; everything else can wait for the
       * real stylesheet. Values mirror --zg-bg in src/theme.css, and
       * ThemeFlash.test.tsx fails if the two ever drift apart.
       */
      :root {
        background: #f5f7f6;
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        background: #101613;
        color-scheme: dark;
      }

      body {
        margin: 0;
      }
    </style>
    <script>
      /*
       * Stamps the theme before first paint. This has to be a parser-blocking
       * inline script: /src/main.tsx is a module (deferred), so React does not
       * mount until after the browser has already painted, and a stored dark
       * preference would flash light first.
       *
       * Mirrors initialTheme() in src/theme/themeContext.ts — the storage key
       * and the stored-then-OS rule must stay in step with that module.
       * client/tests/lab-02/ThemeFlash.test.tsx runs this exact script and
       * fails if the two ever disagree.
       */
      ;(function () {
        try {
          var stored = window.localStorage.getItem('toktickit.theme')
          document.documentElement.dataset.theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
